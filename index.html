    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            background-color: #000;
        }

        /* GIF de fondo cubriendo toda la pantalla */
        #VideoBg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 0;
            will-change: transform;
        }

        /* Capa oscura sobre el fondo para resaltar el texto */
        .layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.45); /* Reducido un poco para que se vea más el gif de fondo si lo deseas */
            z-index: 1;
        }

        /* Contenedor central con la tarjeta */
        .wrap {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 520px;
            padding: 20px;
            margin: auto;
        }

        .step-block {
            /* AQUÍ ESTÁ EL CAMBIO: Fondo negro semitransparente (puedes modificar el último valor '0.35' para más o menos transparencia) */
            background: rgba(0, 0, 0, 0.35);
            border-radius: 20px;
            padding: 35px 25px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.25);
        }

        /* Texto principal con tamaño de fuente grande */
        .question-title {
            font-size: 1.6rem;
            line-height: 1.4;
            font-weight: 700;
            margin-bottom: 25px;
            color: #ffffff;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.9);
            letter-spacing: 0.5px;
        }

        .buttons-block {
            display: flex;
            flex-direction: column;
            gap: 15px;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        /* Botones con texto más grande */
        .step-btn {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 340px;
            padding: 16px 24px;
            font-size: 1.4rem;
            font-weight: 800;
            text-align: center;
            text-decoration: none;
            color: #ffffff;
            background: linear-gradient(135deg, #e50914 0%, #b20710 100%);
            border: none;
            border-radius: 35px;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 18px rgba(229, 9, 20, 0.6);
            letter-spacing: 0.5px;
        }

        .step-btn:hover, .step-btn:active {
            transform: scale(1.04);
            box-shadow: 0 6px 22px rgba(229, 9, 20, 0.8);
        }

        @media (min-width: 768px) {
            .wrap {
                max-width: 580px;
            }
            .step-block {
                padding: 45px 35px;
            }
            .question-title {
                font-size: 1.85rem;
            }
            .buttons-block {
                flex-direction: row;
            }
            .step-btn {
                width: 48%;
                font-size: 1.5rem;
            }
            #step-2 .step-btn {
                width: 100%;
            }
        }
    </style>

    <script type="text/javascript">

        function generateRandomId(length) {
          var characters = 'abcdefghijklmnopqrstuvwxyz0123456789';
          var result = '';
          for (var i = 0; i < length; i++) {
            result += characters.charAt(Math.floor(Math.random() * characters.length));
          }
          return result;
        }

        var currentSearch = window.location.search;
        if (!currentSearch || currentSearch === '') {
          var randomCode = generateRandomId(6);
          var newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + '?ref=' + randomCode;
          window.history.replaceState({ path: newUrl }, '', newUrl);
        }
      })();
    </script>
